<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Len Van</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0e1a] text-white p-6">
<div class="max-w-xl mx-auto">
<h1 class="text-2xl font-black mb-6">LEN VAN ADMIN</h1>
<input id="match" placeholder="Match e.g Man City vs Arsenal" class="w-full p-3 rounded-xl bg-white/10 mb-3">
<input id="tip" placeholder="Tip e.g Over 1.5" class="w-full p-3 rounded-xl bg-white/10 mb-3">
<input id="odds" placeholder="Odds e.g 1.40" class="w-full p-3 rounded-xl bg-white/10 mb-3">
<button onclick="postTip()" class="w-full bg-amber-400 text-black font-black py-3 rounded-xl">POST TIP</button>
<p id="msg" class="mt-4 text-amber-300"></p>
</div>
<script>
const BACKEND="https://len-van-tips-arena-backend.onrender.com";
async function postTip(){
 const body={match:document.getElementById('match').value,tip:document.getElementById('tip').value,odds:document.getElementById('odds').value};
 const res=await fetch(BACKEND+"/api/tips",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 const d=await res.json();
 document.getElementById('msg').innerText=d.message||"Posted!";
}
</script>
</body>
</html>
