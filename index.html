<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Len Van Tips Arena</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
<div class="max-w-2xl mx-auto p-4">
<h1 class="text-3xl font-bold text-green-400 text-center py-6">🔥 Len Van Tips Arena 🔥</h1>
<p class="text-center text-gray-400 mb-6">Free Tips • M-Pesa VIP • Kenya #1</p>
<div id="tips" class="space-y-4">Loading tips...</div>
<div class="text-center mt-8">
<a href="admin.html" class="text-green-400 underline">Admin</a>
</div>
</div>
<script>
const API='https://len-van-tips-arena-backend.onrender.com/api/tips';
async function load(){
 try{
  const r=await fetch(API);
  const data=await r.json();
  if(!data.length){
   document.getElementById('tips').innerHTML='<p class="text-center text-gray-500 py-10">No tips posted yet. Check soon!</p>';
   return;
  }
  document.getElementById('tips').innerHTML=data.map(t=>`
   <div class="bg-gray-900 p-4 rounded-xl border border-green-500/40">
    <div class="flex justify-between"><b>${t.match}</b><b class="text-green-400">${t.odds}</b></div>
    <div class="mt-2 text-green-300">✅ ${t.tip}</div>
    <div class="text-xs text-gray-500 mt-2">${new Date(t.createdAt).toLocaleString()}</div>
   </div>
  `).join('');
 }catch(e){
  document.getElementById('tips').innerHTML='<p class="text-red-400 text-center">Backend sleeping, refresh after 30 sec</p>';
 }
}
load();
</script>
</body>
</html>
